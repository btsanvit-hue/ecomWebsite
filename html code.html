<!DOCTYPE html>
<html>
<head>
    <title>Shopping Cart</title>
    <link rel="stylesheet" href="code.css">
</head>

<body>

<h1>Simple Shopping Cart</h1>

<div id="products">

    <div class="card">
        <h2>Laptop</h2>
		<p>   <img  />  </p>
        <p>Price : ₹50000</p>
        <button onclick="addToCart('Laptop',50000)">Add to Cart</button>
    </div>

    <div class="card">
        <h2>Mouse</h2>
        <p>Price : ₹500</p>
        <button onclick="addToCart('Mouse',500)">Add to Cart</button>
    </div>

    <div class="card">
        <h2>Keyboard</h2>
        <p>Price : ₹1500</p>
        <button onclick="addToCart('Keyboard',1500)">Add to Cart</button>
    </div>

</div>

<hr>

<h2>Shopping Cart</h2>  <span id="totalCount">  </span>

<div id="cartItems"></div>

<h3 id="total"></h3>

<button onclick="clearCart()">Clear Cart</button>

<script src="code.js"></script>

</body>
</html>
